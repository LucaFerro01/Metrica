# Infrastruttura locale di sviluppo (solo database e bus di eventi).
# Compatibile con Docker e Podman:
#   docker compose -f deploy/compose.yaml up -d
#   podman compose -f deploy/compose.yaml up -d
#
# Le porte sono pubblicate solo su 127.0.0.1 (DEC-009): nulla e' raggiungibile dalla rete locale.
# I servizi applicativi verranno aggiunti qui man mano che esistono.
# Le password sono VALORI DI SOLO SVILUPPO: non usarle in produzione.
# Per cambiarle crea deploy/.env (non versionato), vedi deploy/.env.example.

name: metrica

services:
  postgres:
    image: docker.io/timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-metrica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_only_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-metrica}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Crea gli schemi e gli utenti per servizio al primo avvio.
      # Con Podman su Linux/SELinux può servire il suffisso ":Z" sul bind mount.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metrica} -d ${POSTGRES_DB:-metrica}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nats:
    image: docker.io/library/nats:2
    # La configurazione (JetStream, monitoraggio HTTP, max_payload a 8 MB) è in nats/nats-server.conf.
    command: ["-c", "/etc/nats/nats-server.conf"]
    ports:
      - "127.0.0.1:${NATS_PORT:-4222}:4222"
      - "127.0.0.1:${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats-data:/data
      # Con Podman su Linux/SELinux può servire il suffisso ":Z" sul bind mount.
      - ./nats/nats-server.conf:/etc/nats/nats-server.conf:ro
    restart: unless-stopped

volumes:
  postgres-data:
  nats-data:
