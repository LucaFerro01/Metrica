# Configurazione del server NATS (sviluppo e test di integrazione; DEC-012, REQ-036).
# Montata in /etc/nats/nats-server.conf e avviata con "-c" (vedi deploy/compose.yaml
# e tests/TriMetric.TestInfrastructure/NatsFixture.cs: stesso file, stessa configurazione).

# Porta dei client.
port: 4222

# Monitoraggio HTTP (/healthz, /varz).
http: 8222

# Dimensione massima di un messaggio: 8 MB (8388608 byte). Il default del server e 1 MB,
# insufficiente per l'evento ActivityImported nel caso peggiore (100.000 punti).
max_payload: 8MB

# JetStream con persistenza su disco; /data e il volume "nats-data" in compose.
jetstream {
  store_dir: /data
}
